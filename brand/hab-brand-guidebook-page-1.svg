<svg width="1600" height="2200" viewBox="0 0 1600 2200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#212A33" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="2200" fill="#040A11"/>
  <rect width="1600" height="2200" fill="url(#grid)" opacity="0.5"/>

  <text x="96" y="92" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">HAB. BRAND GUIDEBOOK / PAGE 1</text>
  <text x="96" y="250" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="166" font-weight="700" letter-spacing="-7">hab</text>
  <circle cx="472" cy="217" r="20" fill="#60E56B"/>
  <text x="96" y="338" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="52" font-weight="700">Цифровая мастерская,</text>
  <text x="96" y="396" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="52" font-weight="700">а не агентство.</text>
  <text x="96" y="456" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="28">Система бренда строится вокруг идеи</text>
  <text x="96" y="494" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="28">hub / node / product system.</text>

  <rect x="96" y="500" width="438" height="228" rx="28" fill="#09121C" stroke="#212A33"/>
  <text x="132" y="568" fill="#60E56B" font-family="Arial, sans-serif" font-size="24" font-weight="700">ПОЗИЦИОНИРОВАНИЕ</text>
  <text x="132" y="626" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="30" font-weight="700">Не агентство.</text>
  <text x="132" y="662" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="30" font-weight="700">Мастерская.</text>
  <text x="132" y="692" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="19">Компактная команда, один контур:</text>
  <text x="132" y="720" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="19">дизайн, код, запуск, развитие.</text>

  <rect x="580" y="500" width="438" height="228" rx="28" fill="#09121C" stroke="#212A33"/>
  <text x="616" y="568" fill="#60E56B" font-family="Arial, sans-serif" font-size="24" font-weight="700">ХАРАКТЕР</text>
  <text x="616" y="626" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="30" font-weight="700">Спокойный</text>
  <text x="616" y="662" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="30" font-weight="700">и уверенный</text>
  <text x="616" y="692" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="19">Технологичный, собранный,</text>
  <text x="616" y="720" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="19">без пафоса и рекламной мишуры.</text>

  <rect x="1064" y="500" width="438" height="228" rx="28" fill="#09121C" stroke="#212A33"/>
  <text x="1100" y="568" fill="#60E56B" font-family="Arial, sans-serif" font-size="24" font-weight="700">СИМВОЛ</text>
  <text x="1100" y="626" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="30" font-weight="700">Точка как</text>
  <text x="1100" y="662" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="30" font-weight="700">active node</text>
  <text x="1100" y="692" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="19">Не финал фразы, а центр связи,</text>
  <text x="1100" y="720" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="19">запуска и маршрутизации.</text>

  <text x="96" y="842" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="60" font-weight="700">Логосистема</text>
  <rect x="96" y="886" width="1408" height="676" rx="32" fill="#09121C" stroke="#212A33"/>

  <rect x="132" y="932" width="404" height="586" rx="24" fill="#0C1621" stroke="#212A33"/>
  <text x="164" y="986" fill="#8F9AA4" font-family="Courier New, monospace" font-size="22" font-weight="700">WORDMARK</text>
  <text x="164" y="1166" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="138" font-weight="700" letter-spacing="-6">hab</text>
  <circle cx="423" cy="1132" r="18" fill="#60E56B"/>
  <text x="164" y="1280" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="26">Основной знак бренда.</text>
  <text x="164" y="1318" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="26">Строчный, чистый,</text>
  <text x="164" y="1352" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="26">без декора.</text>
  <text x="164" y="1430" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="24" font-weight="700">Правила:</text>
  <text x="164" y="1468" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="22">• без теней</text>
  <text x="164" y="1502" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="22">• без градиента в тексте</text>

  <rect x="598" y="932" width="404" height="586" rx="24" fill="#0C1621" stroke="#212A33"/>
  <text x="630" y="986" fill="#8F9AA4" font-family="Courier New, monospace" font-size="22" font-weight="700">NODE ICON</text>
  <circle cx="800" cy="1144" r="22" fill="#60E56B"/>
  <circle cx="800" cy="1018" r="8" fill="#F4F2EA"/>
  <circle cx="908" cy="1082" r="8" fill="#F4F2EA"/>
  <circle cx="908" cy="1206" r="8" fill="#F4F2EA"/>
  <circle cx="692" cy="1206" r="8" fill="#F4F2EA"/>
