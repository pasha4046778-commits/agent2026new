  <line x1="800" y1="1124" x2="800" y2="1030" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <line x1="817" y1="1134" x2="892" y2="1089" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <line x1="817" y1="1156" x2="892" y2="1199" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <line x1="783" y1="1156" x2="708" y2="1199" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <line x1="783" y1="1134" x2="708" y2="1089" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <text x="630" y="1280" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="23">Знак для favicon, OG</text>
  <text x="630" y="1314" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="23">и соцсетей.</text>
  <text x="630" y="1360" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="23">Node — главный акцент.</text>

  <rect x="1064" y="932" width="404" height="586" rx="24" fill="#0C1621" stroke="#212A33"/>
  <text x="1096" y="986" fill="#8F9AA4" font-family="Courier New, monospace" font-size="22" font-weight="700">HEX HUB</text>
  <polygon points="1266,1016 1382,1083 1382,1217 1266,1284 1150,1217 1150,1083" stroke="#F4F2EA" stroke-width="8"/>
  <circle cx="1266" cy="1150" r="22" fill="#60E56B"/>
  <line x1="1266" y1="1130" x2="1266" y2="1042" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <line x1="1283" y1="1140" x2="1362" y2="1094" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <line x1="1283" y1="1162" x2="1362" y2="1208" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <line x1="1249" y1="1162" x2="1170" y2="1208" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <line x1="1249" y1="1140" x2="1170" y2="1094" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
  <text x="1096" y="1312" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="21">Системный вариант:</text>
  <text x="1096" y="1344" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="21">модульность, сеть,</text>
  <text x="1096" y="1376" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="21">инженерная чистота.</text>

  <text x="96" y="1684" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="60" font-weight="700">Палитра</text>
  <rect x="96" y="1728" width="1408" height="354" rx="32" fill="#09121C" stroke="#212A33"/>

  <rect x="132" y="1780" width="300" height="126" rx="22" fill="#040A11" stroke="#212A33"/>
  <text x="156" y="1830" fill="#8F9AA4" font-family="Courier New, monospace" font-size="22">BG</text>
  <text x="156" y="1876" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="30" font-weight="700">#040A11</text>

  <rect x="462" y="1780" width="300" height="126" rx="22" fill="#09121C" stroke="#212A33"/>
  <text x="486" y="1830" fill="#8F9AA4" font-family="Courier New, monospace" font-size="22">BG-ELEV</text>
  <text x="486" y="1876" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="30" font-weight="700">#09121C</text>

  <rect x="792" y="1780" width="300" height="126" rx="22" fill="#F4F2EA"/>
  <text x="816" y="1830" fill="#5B646E" font-family="Courier New, monospace" font-size="22">FG</text>
  <text x="816" y="1876" fill="#021704" font-family="Arial, sans-serif" font-size="30" font-weight="700">#F4F2EA</text>

  <rect x="1122" y="1780" width="300" height="126" rx="22" fill="#60E56B"/>
  <text x="1146" y="1830" fill="#021704" font-family="Courier New, monospace" font-size="22">ACCENT</text>
  <text x="1146" y="1876" fill="#021704" font-family="Arial, sans-serif" font-size="30" font-weight="700">#60E56B</text>

  <text x="132" y="1958" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="22">Accent используется точечно:</text>
  <text x="132" y="1988" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="22">CTA, node-элементы, ключевые сигналы.</text>
  <text x="132" y="2026" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="22">Основная сцена бренда — тёмная,</text>
  <text x="132" y="2056" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="22">технологичная и собранная.</text>

  <text x="96" y="2130" fill="#5B646E" font-family="Arial, sans-serif" font-size="20">v1 by Amber</text>
