    <line x1="800" y1="434" x2="800" y2="342" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="815" y1="442" x2="888" y2="397" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
