    <text x="612" y="732" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">favicon, аватарок и мест</text>
    <text x="612" y="760" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">без wordmark.</text>
  </g>

  <g>
