<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60E56B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60E56B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#212A33" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#040A11"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.7"/>

  <text x="80" y="84" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="0.18em">HAB. / BRAND MARK EXPLORATION V1</text>
  <text x="80" y="968" fill="#8F9AA4" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="0.06em">bg #040A11 · fg #F4F2EA · accent #60E56B · concept: node / hub / system</text>

  <rect x="64" y="128" width="1472" height="808" rx="30" fill="#09121C" stroke="#212A33"/>

  <g>
    <rect x="96" y="160" width="440" height="744" rx="24" fill="#0B1621" stroke="#212A33"/>
    <text x="128" y="214" fill="#8F9AA4" font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="0.12em">01 / WORDMARK</text>
