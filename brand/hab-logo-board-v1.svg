    <circle cx="800" cy="450" r="110" fill="url(#glow)" opacity="0.9"/>
    <circle cx="800" cy="450" r="20" fill="#60E56B"/>
    <circle cx="800" cy="330" r="8" fill="#F4F2EA"/>
    <circle cx="904" cy="390" r="8" fill="#F4F2EA"/>
