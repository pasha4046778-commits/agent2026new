    <text x="126" y="536" fill="#F4F2EA" font-family="Inter, Arial, sans-serif" font-size="164" font-weight="500" letter-spacing="-0.04em">hab</text>
    <circle cx="433" cy="501" r="20" fill="#60E56B" filter="url(#softGlow)"/>
    <text x="128" y="704" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">Точка — это node:</text>
    <text x="128" y="732" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">центр связи и сигнал</text>
    <text x="128" y="760" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">активации бренда.</text>
  </g>

