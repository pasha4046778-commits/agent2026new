      <stop offset="0%" stop-color="#60E56B" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#60E56B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#60E56B" stop-opacity="0"/>
