  <text x="96" y="96" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">HAB. BRAND GUIDEBOOK / VISUAL V1</text>
  <text x="96" y="250" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="166" font-weight="700" letter-spacing="-7">hab</text>
  <circle cx="472" cy="217" r="20" fill="#60E56B"/>
  <text x="96" y="340" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="54" font-weight="700">Цифровая мастерская, а не агентство.</text>
  <text x="96" y="404" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="30">Собираем сайты, веб-приложения и цифровые продукты как рабочие системы:</text>
  <text x="96" y="446" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="30">чисто, быстро, технологично, без маркетингового тумана.</text>

  <rect x="96" y="540" width="432" height="184" rx="28" fill="#09121C" stroke="#212A33"/>
  <text x="132" y="612" fill="#60E56B" font-family="Arial, sans-serif" font-size="26" font-weight="700">ПОЗИЦИОНИРОВАНИЕ</text>
  <text x="132" y="664" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="34" font-weight="700">Не агентство. Мастерская.</text>
  <text x="132" y="708" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="26">Один контур: дизайн, код, запуск, развитие.</text>

  <rect x="584" y="540" width="432" height="184" rx="28" fill="#09121C" stroke="#212A33"/>
  <text x="620" y="612" fill="#60E56B" font-family="Arial, sans-serif" font-size="26" font-weight="700">ТЕМП</text>
  <text x="620" y="664" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="34" font-weight="700">Быстро, но не суетно</text>
  <text x="620" y="708" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="26">MVP-first, запуск за 2–6 недель, дальше — итерации.</text>

  <rect x="1072" y="540" width="432" height="184" rx="28" fill="#09121C" stroke="#212A33"/>
  <text x="1108" y="612" fill="#60E56B" font-family="Arial, sans-serif" font-size="26" font-weight="700">ОБРАЗ</text>
  <text x="1108" y="664" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="34" font-weight="700">Node / Hub / System</text>
  <text x="1108" y="708" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="26">Точка — активный узел, а не просто знак препинания.</text>

  <text x="96" y="860" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="62" font-weight="700">1. Логосистема</text>
  <rect x="96" y="904" width="1408" height="700" rx="32" fill="#09121C" stroke="#212A33"/>

  <rect x="132" y="948" width="404" height="612" rx="24" fill="#0C1621" stroke="#212A33"/>
  <text x="164" y="1002" fill="#8F9AA4" font-family="Courier New, monospace" font-size="24" font-weight="700">WORDMARK</text>
  <text x="164" y="1188" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="138" font-weight="700" letter-spacing="-6">hab</text>
  <circle cx="423" cy="1154" r="18" fill="#60E56B"/>
  <text x="164" y="1322" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="28">Основа бренда: lowercase,</text>
  <text x="164" y="1360" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="28">спокойный гротеск, точка как node.</text>
  <text x="164" y="1450" fill="#F4F2EA" font-family="Arial, sans-serif" font-size="26" font-weight="700">Правила:</text>
  <text x="164" y="1492" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="24">• без теней и 3D</text>
  <text x="164" y="1528" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="24">• без курсивов и градиентов в тексте</text>

  <rect x="598" y="948" width="404" height="612" rx="24" fill="#0C1621" stroke="#212A33"/>
  <text x="630" y="1002" fill="#8F9AA4" font-family="Courier New, monospace" font-size="24" font-weight="700">NODE ICON</text>
