  <text x="630" y="1492" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="24">• favicon</text>
  <text x="630" y="1528" fill="#8F9AA4" font-family="Arial, sans-serif" font-size="24">• аватарка</text>

  <rect x="1064" y="948" width="404" height="612" rx="24" fill="#0C1621" stroke="#212A33"/>
  <text x="1096" y="1002" fill="#8F9AA4" font-family="Courier New, monospace" font-size="24" font-weight="700">HEX HUB</text>
  <polygon points="1266,1072 1382,1139 1382,1273 1266,1340 1150,1273 1150,1139" stroke="#F4F2EA" stroke-width="8"/>
