<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60E56B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60E56B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#212A33" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#040A11"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.7"/>

  <text x="80" y="84" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="0.18em">HAB. / BRAND MARK EXPLORATION V1</text>
  <text x="80" y="942" fill="#5B646E" font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="0.08em">bg #040A11 · fg #F4F2EA · accent #60E56B · concept: node / hub / system</text>

  <rect x="64" y="128" width="1472" height="808" rx="30" fill="#09121C" stroke="#212A33"/>

  <g>
    <rect x="96" y="160" width="440" height="744" rx="24" fill="#0B1621" stroke="#212A33"/>
    <text x="128" y="214" fill="#8F9AA4" font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="0.12em">01 / WORDMARK</text>
    <circle cx="316" cy="520" r="132" fill="url(#glow)"/>
    <text x="126" y="556" fill="#F4F2EA" font-family="Inter, Arial, sans-serif" font-size="164" font-weight="500" letter-spacing="-0.04em">hab</text>
    <circle cx="433" cy="521" r="20" fill="#60E56B" filter="url(#softGlow)"/>
    <text x="128" y="690" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400">Точка — это node: центр связи, сигнал активации,</text>
    <text x="128" y="726" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400">маленький, но главный носитель бренда.</text>
  </g>

  <g>
    <rect x="580" y="160" width="440" height="744" rx="24" fill="#0B1621" stroke="#212A33"/>
    <text x="612" y="214" fill="#8F9AA4" font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="0.12em">02 / NODE ICON</text>
    <circle cx="800" cy="462" r="118" fill="url(#glow)" opacity="0.9"/>
    <circle cx="800" cy="462" r="20" fill="#60E56B"/>
    <circle cx="800" cy="332" r="8" fill="#F4F2EA"/>
    <circle cx="912" cy="396" r="8" fill="#F4F2EA"/>
    <circle cx="912" cy="528" r="8" fill="#F4F2EA"/>
    <circle cx="688" cy="528" r="8" fill="#F4F2EA"/>
    <circle cx="688" cy="396" r="8" fill="#F4F2EA"/>
    <line x1="800" y1="446" x2="800" y2="344" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="815" y1="454" x2="896" y2="403" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="815" y1="470" x2="896" y2="521" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="785" y1="470" x2="704" y2="521" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="785" y1="454" x2="704" y2="403" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <text x="612" y="690" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400">Самостоятельный знак для favicon, аватарок и</text>
    <text x="612" y="726" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400">тех мест, где нужен символ без wordmark.</text>
  </g>

  <g>
    <rect x="1064" y="160" width="440" height="744" rx="24" fill="#0B1621" stroke="#212A33"/>
    <text x="1096" y="214" fill="#8F9AA4" font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="0.12em">03 / HEX HUB</text>
    <circle cx="1284" cy="462" r="118" fill="url(#glow)" opacity="0.9"/>
    <polygon points="1284,328 1400,395 1400,529 1284,596 1168,529 1168,395" stroke="#F4F2EA" stroke-width="8"/>
    <circle cx="1284" cy="462" r="20" fill="#60E56B"/>
    <line x1="1284" y1="442" x2="1284" y2="354" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="1301" y1="452" x2="1380" y2="406" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="1301" y1="472" x2="1380" y2="518" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="1267" y1="472" x2="1188" y2="518" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <line x1="1267" y1="452" x2="1188" y2="406" stroke="#F4F2EA" stroke-width="5" stroke-linecap="round"/>
    <text x="1096" y="690" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400">Более системный и модульный знак. Хорошо ляжет</text>
    <text x="1096" y="726" fill="#8F9AA4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400">на OG, иконки продукта и суббрендовые носители.</text>
  </g>
